services:
  app:
    # Uygulama servisi
    build: .
    container_name: qr-code-generator-app
    ports:
      - "8000:8000"
    environment:
      APP_ENV: docker
      DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/qr_service
      S3_BUCKET_NAME: qr-code-assets
      S3_REGION: us-east-1
      S3_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      - postgres
      - localstack

  postgres:
    # Veritabanı servisi
    image: postgres:16
    container_name: qr-code-generator-postgres
    environment:
      POSTGRES_DB: qr_service
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  localstack:
    # S3 uyumlu yerel servis
    image: localstack/localstack:3.8
    container_name: qr-code-generator-localstack
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack

  prometheus:
    # Prometheus metrik toplar
    image: prom/prometheus:v2.54.1
    container_name: qr-code-generator-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app

  grafana:
    # Grafana panelleri gösterir
    image: grafana/grafana:11.2.0
    container_name: qr-code-generator-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/grafana-dashboard.json:ro
      - ./monitoring/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres-data:
  localstack-data:
