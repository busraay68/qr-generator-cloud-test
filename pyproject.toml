[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bmtm-qr-code-generator"
version = "1.0.0"
description = "Bulut Mimarilerinde Test Mühendisligi donem projesi - Konu 35 QR Code Generator Service"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "busra" }
]
dependencies = [
  "boto3>=1.35.0",
  "fastapi>=0.115.0",
  "jinja2>=3.1.4",
  "prometheus-fastapi-instrumentator>=7.0.0",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.4.0",
  "qrcode[pil]>=7.4.2",
  "sqlalchemy>=2.0.34",
  "uvicorn>=0.30.6",
]

[project.optional-dependencies]
dev = [
  "factory-boy>=3.3.1",
  "faker>=28.4.1",
  "httpx>=0.27.2",
  "playwright>=1.47.0",
  "pytest>=8.3.3",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.4",
  "testcontainers[postgres]>=4.8.1",
]

[tool.setuptools]
packages = ["src", "src.routes", "src.services"]

[tool.setuptools.package-data]
src = ["templates/*.html"]

[tool.ruff]
exclude = [".venv", ".venv311"]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/integration/*.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
